<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>James Bike ($BIKE) — Monad Pixel Drift</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        monadBgDark: '#090015',
                        monadBgMid: '#130028',
                        monadBgLight: '#1D0838',
                        primary: '#8B5CFF',
                        secondary: '#C5FF3D',
                        accent: '#B87DFF',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Press+Start+2P&display=swap');
        
        body {
            background: linear-gradient(135deg, #090015 0%, #130028 50%, #1D0838 100%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevent body scrolling while playing */
            position: fixed;
            width: 100%;
            height: 100%;
            touch-action: none; /* Prevent accidental browser gestures */
        }

        .font-pixel {
            font-family: 'Press Start 2P', monospace;
        }

        .neon-box-purple {
            box-shadow: 0 0 20px rgba(139, 92, 255, 0.4);
            border: 1px solid rgba(139, 92, 255, 0.3);
        }

        .neon-box-lime {
            box-shadow: 0 0 20px rgba(197, 255, 61, 0.4);
            border: 1px solid rgba(197, 255, 61, 0.3);
        }

        /* Prevent text selection and zooming on buttons */
        button {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-monadBgDark text-white flex flex-col justify-between h-full w-full">

    <!-- Top Header -->
    <header class="w-full bg-monadBgMid/90 border-b border-primary/20 px-4 h-14 flex items-center justify-between shrink-0 z-30">
        <div class="flex items-center space-x-2">
            <img src="https://i.imgur.com/BmyXHa3.jpeg" alt="$BIKE" class="w-7 h-7 object-contain rounded-md neon-box-purple">
            <span class="font-bold text-xs tracking-wider font-pixel">JAMES <span class="text-secondary">BIKE</span></span>
        </div>
        <div class="flex items-center space-x-2">
            <a href="https://x.com/i/status/2085171884136493157" target="_blank" class="px-2.5 py-1 rounded bg-primary/20 border border-primary text-[10px] font-bold text-primary">X</a>
            <span class="px-2.5 py-1 rounded bg-secondary text-monadBgDark font-pixel text-[8px] font-bold">MONAD</span>
        </div>
    </header>

    <!-- Main Game Area -->
    <main class="flex-1 flex flex-col items-center justify-center p-2 relative overflow-hidden w-full max-w-4xl mx-auto">
        
        <!-- Game Container -->
        <div class="w-full h-full max-h-[75vh] bg-monadBgMid rounded-2xl neon-box-purple p-3 relative flex flex-col justify-between">
            
            <!-- HUD -->
            <div class="grid grid-cols-4 gap-2 bg-monadBgDark/80 p-2 rounded-xl border border-primary/20 text-[10px] sm:text-xs font-mono text-center shrink-0">
                <div><span class="text-gray-400 block text-[9px]">SCORE</span><span id="hud-score" class="text-secondary font-bold">0</span></div>
                <div><span class="text-gray-400 block text-[9px]">DISTANCE</span><span id="hud-distance" class="text-white font-bold">0m</span></div>
                <div><span class="text-gray-400 block text-[9px]">COMBO</span><span id="hud-combo" class="text-primary font-bold">1x</span></div>
                <div><span class="text-gray-400 block text-[9px]">COINS</span><span id="hud-coins" class="text-secondary font-bold">🪙 0</span></div>
            </div>

            <!-- Canvas Viewport -->
            <div class="relative flex-1 w-full my-2 bg-monadBgDark rounded-xl overflow-hidden border border-primary/30 flex items-center justify-center">
                <canvas id="gameCanvas" class="w-full h-full object-cover"></canvas>

                <!-- Start Screen -->
                <div id="start-overlay" class="absolute inset-0 bg-monadBgDark/95 backdrop-blur-sm flex flex-col items-center justify-center text-center p-4 z-20">
                    <img src="https://i.imgur.com/BmyXHa3.jpeg" alt="James Bike" class="w-16 h-16 object-contain mb-3 rounded-xl neon-box-purple animate-bounce p-1">
                    <h2 class="font-pixel text-sm sm:text-lg text-secondary mb-2">JAMES BIKE DRIFT</h2>
                    <p class="text-[11px] text-gray-300 mb-4 font-mono max-w-xs">Use touch controls below or keyboard arrows. Press START to race!</p>
                    <button onclick="initGame()" class="px-6 py-3 bg-secondary text-monadBgDark font-bold rounded-xl font-pixel text-[10px] hover:scale-105 transition neon-box-lime">
                        START GAME
                    </button>
                </div>

                <!-- Game Over Screen -->
                <div id="gameover-overlay" class="absolute inset-0 bg-monadBgDark/95 backdrop-blur-md flex flex-col items-center justify-center text-center p-4 z-20 hidden">
                    <h2 class="font-pixel text-base sm:text-xl text-red-500 mb-2">CRASHED!</h2>
                    <p class="text-[11px] text-gray-400 mb-3 font-mono">Your Monad run has ended.</p>
                    
                    <div class="bg-monadBgMid p-3 rounded-xl mb-4 w-56 text-xs font-mono space-y-1.5 border border-primary/30 text-left">
                        <div class="flex justify-between"><span>Score:</span><span id="go-score" class="text-secondary font-bold">0</span></div>
                        <div class="flex justify-between"><span>Distance:</span><span id="go-distance" class="text-white font-bold">0m</span></div>
                        <div class="flex justify-between"><span>Coins:</span><span id="go-coins" class="text-secondary font-bold">0</span></div>
                    </div>

                    <button onclick="initGame()" class="px-6 py-3 bg-secondary text-monadBgDark font-bold rounded-xl font-pixel text-[10px] hover:scale-105 transition neon-box-lime">
                        PLAY AGAIN
                    </button>
                </div>
            </div>

            <!-- Nitro Bar -->
            <div class="w-full bg-monadBgDark/80 p-2 rounded-xl border border-primary/20 flex items-center space-x-3 shrink-0">
                <span class="text-[10px] font-mono text-secondary font-bold">NITRO</span>
                <div class="flex-1 bg-gray-900 h-2 rounded-full overflow-hidden border border-secondary/30">
                    <div id="hud-nitro" class="bg-secondary h-full w-full transition-all"></div>
                </div>
            </div>

        </div>
    </main>

    <!-- FIXED MOBILE TOUCH CONTROLS (Always rendered for mobile support) -->
    <div id="touch-controls" class="w-full max-w-4xl mx-auto px-4 pb-4 pt-1 grid grid-cols-2 gap-4 shrink-0 z-30 select-none">
        <!-- Left Side: Steering -->
        <div class="flex space-x-2">
            <button id="btn-left" class="flex-1 h-16 sm:h-20 bg-primary/20 border-2 border-primary rounded-2xl flex items-center justify-center text-xl font-bold active:bg-primary transition-colors">
                ◀
            </button>
            <button id="btn-right" class="flex-1 h-16 sm:h-20 bg-primary/20 border-2 border-primary rounded-2xl flex items-center justify-center text-xl font-bold active:bg-primary transition-colors">
                ▶
            </button>
        </div>

        <!-- Right Side: Action (Accelerate, Brake, Nitro) -->
        <div class="grid grid-cols-3 gap-2">
            <button id="btn-brake" class="h-16 sm:h-20 bg-red-500/20 border-2 border-red-500 rounded-2xl flex items-center justify-center text-lg font-bold active:bg-red-500 transition-colors">
                ▼
            </button>
            <button id="btn-accel" class="h-16 sm:h-20 bg-secondary/20 border-2 border-secondary rounded-2xl flex items-center justify-center text-lg font-bold text-secondary active:bg-secondary active:text-monadBgDark transition-colors">
                ▲
            </button>
            <button id="btn-nitro" class="h-16 sm:h-20 bg-accent/20 border-2 border-accent rounded-2xl flex items-center justify-center text-xs font-bold text-accent active:bg-accent active:text-monadBgDark transition-colors font-pixel">
                ⚡
            </button>
        </div>
    </div>

    <!-- Game Engine Script -->
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gameActive = false;
        let score = 0;
        let distance = 0;
        let combo = 1;
        let coins = 0;
        let nitro = 100;
        let speed = 6;
        let roadOffset = 0;

        const bikeImg = new Image();
        bikeImg.src = "https://i.imgur.com/BmyXHa3.jpeg";
        let imageLoaded = false;
        bikeImg.onload = () => { imageLoaded = true; };

        let bike = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 90,
            width: 48,
            height: 48,
            angle: 0
        };

        // Input state mapping
        let inputs = {
            left: false,
            right: false,
            accel: false,
            brake: false,
            nitro: false
        };

        // Keyboard mappings
        let keys = {};
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            updateInputStates();
        });
        window.addEventListener('keyup', e => {
            keys[e.code] = false;
            updateInputStates();
        });

        function updateInputStates() {
            inputs.left = keys['ArrowLeft'] || keys['KeyA'] || touchStates.left;
            inputs.right = keys['ArrowRight'] || keys['KeyD'] || touchStates.right;
            inputs.accel = keys['ArrowUp'] || keys['KeyW'] || touchStates.accel;
            inputs.brake = keys['ArrowDown'] || keys['KeyS'] || touchStates.brake;
            inputs.nitro = keys['Space'] || touchStates.nitro;
        }

        // Touch States
        let touchStates = { left: false, right: false, accel: false, brake: false, nitro: false };

        function bindTouchButton(id, stateKey) {
            const btn = document.getElementById(id);
            if (!btn) return;

            const activate = (e) => {
                e.preventDefault();
                touchStates[stateKey] = true;
                updateInputStates();
            };

            const deactivate = (e) => {
                e.preventDefault();
                touchStates[stateKey] = false;
                updateInputStates();
            };

            btn.addEventListener('pointerdown', activate);
            btn.addEventListener('pointerup', deactivate);
            btn.addEventListener('pointerleave', deactivate);
            btn.addEventListener('touchstart', activate, {passive: false});
            btn.addEventListener('touchend', deactivate, {passive: false});
        }

        bindTouchButton('btn-left', 'left');
        bindTouchButton('btn-right', 'right');
        bindTouchButton('btn-accel', 'accel');
        bindTouchButton('btn-brake', 'brake');
        bindTouchButton('btn-nitro', 'nitro');

        let obstacles = [];

        function initGame() {
            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('gameover-overlay').style.display = 'none';
            gameActive = true;
            score = 0;
            distance = 0;
            combo = 1;
            coins = 0;
            nitro = 100;
            speed = 6;
            obstacles = [];
            bike.x = canvas.width / 2 - 24;
            gameLoop();
        }

        function spawnObstacle() {
            if (Math.random() < 0.035) {
                obstacles.push({
                    x: Math.random() * (canvas.width - 90) + 45,
                    y: -50,
                    width: 42,
                    height: 42,
                    type: Math.random() > 0.4 ? 'car' : 'coin'
                });
            }
        }

        function updateGame() {
            if (!gameActive) return;

            // Speed modifications based on input
            let currentSpeed = speed;
            if (inputs.nitro && nitro > 0) {
                currentSpeed = 12;
                nitro -= 0.8;
            } else if (inputs.brake) {
                currentSpeed = 3;
            } else if (inputs.accel) {
                currentSpeed = 8;
            } else {
                if (nitro < 100) nitro += 0.2;
            }

            roadOffset += currentSpeed;
            distance += Math.floor(currentSpeed);
            score += Math.floor(currentSpeed * combo);

            // Steering & Drifting
            if (inputs.left && bike.x > 35) {
                bike.x -= 6.5;
                bike.angle = -0.22;
                combo = 2;
            } else if (inputs.right && bike.x < canvas.width - 80) {
                bike.x += 6.5;
                bike.angle = 0.22;
                combo = 2;
            } else {
                bike.angle = 0;
                combo = 1;
            }

            spawnObstacle();

            // Obstacles update & collision
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].y += currentSpeed;

                let o = obstacles[i];
                if (
                    bike.x < o.x + o.width &&
                    bike.x + bike.width > o.x &&
                    bike.y < o.y + o.height &&
                    bike.y + bike.height > o.y
                ) {
                    if (o.type === 'coin') {
                        coins += 1;
                        obstacles.splice(i, 1);
                    } else {
                        // Crash & Vibrate if supported
                        if (navigator.vibrate) {
                            navigator.vibrate(200);
                        }
                        gameActive = false;
                        document.getElementById('go-score').innerText = score;
                        document.getElementById('go-distance').innerText = distance + 'm';
                        document.getElementById('go-coins').innerText = coins;
                        document.getElementById('gameover-overlay').style.display = 'flex';
                    }
                    continue;
                }

                if (o.y > canvas.height) {
                    obstacles.splice(i, 1);
                }
            }

            // HUD update
            document.getElementById('hud-score').innerText = score;
            document.getElementById('hud-distance').innerText = distance + 'm';
            document.getElementById('hud-combo').innerText = combo + 'x';
            document.getElementById('hud-coins').innerText = '🪙 ' + coins;
            document.getElementById('hud-nitro').style.width = nitro + '%';
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Road background
            ctx.fillStyle = '#0f0b1f';
            ctx.fillRect(30, 0, canvas.width - 60, canvas.height);

            // Road borders
            ctx.strokeStyle = '#8B5CFF';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(30, 0); ctx.lineTo(30, canvas.height);
            ctx.moveTo(canvas.width - 30, 0); ctx.lineTo(canvas.width - 30, canvas.height);
            ctx.stroke();

            // Center lane markings
            ctx.strokeStyle = '#C5FF3D';
            ctx.lineWidth = 3;
            ctx.setLineDash([20, 20]);
            ctx.lineDashOffset = -roadOffset;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0); ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Obstacles & Coins
            obstacles.forEach(o => {
                if (o.type === 'coin') {
                    ctx.fillStyle = '#C5FF3D';
                    ctx.beginPath();
                    ctx.arc(o.x + 21, o.y + 21, 10, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#ff3366';
                    ctx.fillRect(o.x, o.y, o.width, o.height);
                }
            });

            // Render Bike
            ctx.save();
            ctx.translate(bike.x + bike.width / 2, bike.y + bike.height / 2);
            ctx.rotate(bike.angle);
            if (imageLoaded) {
                ctx.drawImage(bikeImg, -bike.width / 2, -bike.height / 2, bike.width, bike.height);
            } else {
                ctx.fillStyle = '#C5FF3D';
                ctx.fillRect(-bike.width / 2, -bike.height / 2, bike.width, bike.height);
            }
            ctx.restore();
        }

        function gameLoop() {
            if (!gameActive) return;
            updateGame();
            drawGame();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
