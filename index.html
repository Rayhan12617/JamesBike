<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>James Bike ($BIKE) — 3D Browser Racing Game on Monad</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        monadBgDark: '#05040D',
                        monadBgMid: '#130028',
                        primary: '#8B5CFF',
                        secondary: '#C5FF3D',
                        accent: '#B87DFF',
                    }
                }
            }
        }
    </script>
    <!-- Three.js for 3D Real Motorcycle Racing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Press+Start+2P&display=swap');
        
        body {
            background-color: #05040D;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .font-pixel {
            font-family: 'Press Start 2P', monospace;
        }

        .neon-box-purple {
            box-shadow: 0 0 25px rgba(139, 92, 255, 0.5);
            border: 1px solid rgba(139, 92, 255, 0.3);
        }

        .neon-box-lime {
            box-shadow: 0 0 25px rgba(197, 255, 61, 0.5);
            border: 1px solid rgba(197, 255, 61, 0.3);
        }
    </style>
</head>
<body class="bg-monadBgDark text-white flex flex-col justify-between h-full w-full">

    <!-- Top Header -->
    <header class="w-full bg-monadBgMid/90 border-b border-primary/20 px-4 h-14 flex items-center justify-between shrink-0 z-30">
        <div class="flex items-center space-x-2">
            <img src="https://i.imgur.com/BmyXHa3.jpeg" alt="$BIKE" class="w-7 h-7 object-contain rounded-md neon-box-purple">
            <span class="font-bold text-xs tracking-wider font-pixel">JAMES <span class="text-secondary">BIKE</span></span>
        </div>
        <div class="flex items-center space-x-2 text-xs font-mono">
            <a href="https://x.com/i/status/2085171884136493157" target="_blank" class="px-2.5 py-1 rounded bg-primary/20 border border-primary text-primary font-bold">X</a>
            <span class="px-2.5 py-1 rounded bg-secondary text-monadBgDark font-pixel text-[8px] font-bold">MONAD 3D</span>
        </div>
    </header>

    <!-- Main Game Viewport (3D Canvas + Direct Touch Control Area) -->
    <main class="flex-1 flex flex-col items-center justify-center p-2 relative overflow-hidden w-full max-w-5xl mx-auto">
        <div class="w-full h-full max-h-[85vh] bg-monadBgMid rounded-2xl neon-box-purple p-2 relative flex flex-col justify-between overflow-hidden">
            
            <!-- HUD Top Bar -->
            <div class="grid grid-cols-4 gap-2 bg-monadBgDark/80 p-2 rounded-xl border border-primary/20 text-[10px] sm:text-xs font-mono text-center shrink-0 z-20">
                <div><span class="text-gray-400 block text-[9px]">SPEED</span><span id="hud-speed" class="text-secondary font-bold">0 KM/H</span></div>
                <div><span class="text-gray-400 block text-[9px]">DISTANCE</span><span id="hud-distance" class="text-white font-bold">0m</span></div>
                <div><span class="text-gray-400 block text-[9px]">FPS</span><span id="hud-fps" class="text-primary font-bold">60</span></div>
                <div><span class="text-gray-400 block text-[9px]">COINS</span><span id="hud-coins" class="text-secondary font-bold">🪙 0</span></div>
            </div>

            <!-- Three.js Canvas Container (Touch anywhere to steer/control) -->
            <div id="canvas-container" class="relative flex-1 w-full my-2 bg-black rounded-xl overflow-hidden border border-primary/30 flex items-center justify-center cursor-crosshair">
                
                <!-- Touch Hint Overlay (Fades out when playing) -->
                <div id="touch-hint" class="absolute bottom-4 left-1/2 -translate-x-1/2 pointer-events-none bg-black/60 backdrop-blur-sm px-4 py-1.5 rounded-full border border-secondary/30 text-[10px] font-mono text-secondary z-20 transition-opacity duration-500">
                    Touch & Drag to Steer • Double Tap for Nitro
                </div>

                <!-- Start Overlay -->
                <div id="start-overlay" class="absolute inset-0 bg-monadBgDark/95 backdrop-blur-md flex flex-col items-center justify-center text-center p-4 z-30">
                    <img src="https://i.imgur.com/BmyXHa3.jpeg" alt="James Bike" class="w-20 h-20 object-contain mb-3 rounded-xl neon-box-purple animate-bounce p-1">
                    <h2 class="font-pixel text-sm sm:text-lg text-secondary mb-2">JAMES BIKE 3D RACER</h2>
                    <p class="text-[11px] text-gray-300 mb-4 font-mono max-w-xs">Full 3D Highway Racing on Monad. Slide anywhere on screen to steer your bike!</p>
                    <button onclick="startGame()" class="px-6 py-3 bg-secondary text-monadBgDark font-bold rounded-xl font-pixel text-[10px] hover:scale-105 transition neon-box-lime cursor-pointer">
                        START 3D ENGINE
                    </button>
                </div>

                <!-- Game Over Overlay -->
                <div id="gameover-overlay" class="absolute inset-0 bg-monadBgDark/95 backdrop-blur-md flex flex-col items-center justify-center text-center p-4 z-30 hidden">
                    <h2 class="font-pixel text-base sm:text-xl text-red-500 mb-2">CRASHED!</h2>
                    <p class="text-[11px] text-gray-400 mb-3 font-mono">Your Monad 3D run has ended.</p>
                    
                    <div class="bg-monadBgMid p-3 rounded-xl mb-4 w-56 text-xs font-mono space-y-1.5 border border-primary/30 text-left">
                        <div class="flex justify-between"><span>Distance:</span><span id="go-distance" class="text-white font-bold">0m</span></div>
                        <div class="flex justify-between"><span>Coins:</span><span id="go-coins" class="text-secondary font-bold">0</span></div>
                    </div>

                    <button onclick="startGame()" class="px-6 py-3 bg-secondary text-monadBgDark font-bold rounded-xl font-pixel text-[10px] hover:scale-105 transition neon-box-lime cursor-pointer">
                        PLAY AGAIN
                    </button>
                </div>
            </div>

            <!-- Nitro & Fuel Bar -->
            <div class="grid grid-cols-2 gap-2 shrink-0 z-20">
                <div class="bg-monadBgDark/80 p-2 rounded-xl border border-primary/20 flex items-center space-x-2">
                    <span class="text-[9px] font-mono text-secondary font-bold">NITRO</span>
                    <div class="flex-1 bg-gray-900 h-2 rounded-full overflow-hidden border border-secondary/30">
                        <div id="nitro-bar" class="bg-secondary h-full w-full transition-all"></div>
                    </div>
                </div>
                <div class="bg-monadBgDark/80 p-2 rounded-xl border border-primary/20 flex items-center space-x-2">
                    <span class="text-[9px] font-mono text-primary font-bold">FUEL</span>
                    <div class="flex-1 bg-gray-900 h-2 rounded-full overflow-hidden border border-primary/30">
                        <div id="fuel-bar" class="bg-primary h-full w-full transition-all" style="width: 100%;"></div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Three.js 3D Racing Game Logic -->
    <script>
        let scene, camera, renderer, bikeMesh;
        let gameRunning = false;
        let distance = 0;
        let coinsCollected = 0;
        let nitroVal = 100;
        let fuelVal = 100;
        let speedKMH = 0;
        let trafficCars = [];
        let coinObjects = [];

        // Direct Touch / Pointer control variables
        let touchTargetX = 0;
        let isTouching = false;
        let lastTapTime = 0;
        let isNitroActive = false;
        let lastClientX = 0;

        let input = { left: false, right: false };

        function init3D() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05040D);
            scene.fog = new THREE.FogExp2(0x05040D, 0.015);

            camera = new THREE.PerspectiveCamera(65, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 3, -6);
            camera.lookAt(0, 1, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x8B5CFF, 1.5);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // Road Setup
            createRoad();

            // Bike Sprite Loader
            const loader = new THREE.TextureLoader();
            loader.load("https://i.imgur.com/OQnpobi.png", function(texture){
                const material = new THREE.SpriteMaterial({
                    map: texture,
                    transparent: true
                });
                bikeMesh = new THREE.Sprite(material);
                bikeMesh.scale.set(2.5, 2.5, 1);
                bikeMesh.position.set(0, 1, 0);
                scene.add(bikeMesh);
            });

            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });

            setupDirectTouchControls(container);
        }

        function createRoad() {
            const roadGeo = new THREE.PlaneGeometry(16, 1000);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x110d26, roughness: 0.8 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.set(0, 0, 500);
            scene.add(road);

            const lineMat = new THREE.MeshBasicMaterial({ color: 0xC5FF3D });
            const leftBorder = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 1000), lineMat);
            leftBorder.position.set(-8, 0.05, 500);
            scene.add(leftBorder);

            const rightBorder = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 1000), lineMat);
            rightBorder.position.set(8, 0.05, 500);
            scene.add(rightBorder);
        }

        function setupDirectTouchControls(container) {
            // Keyboard fallbacks
            window.addEventListener('keydown', e => {
                if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
                if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
                if (e.code === 'Space') isNitroActive = true;
            });
            window.addEventListener('keyup', e => {
                if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
                if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
                if (e.code === 'Space') isNitroActive = false;
            });

            // Relative Swipe/Drag Steering (ডানে সোয়াইপ করলে বাইক ডানে যাবে, বামে সোয়াইপ করলে বামে যাবে)
            container.addEventListener('pointerdown', e => {
                isTouching = true;
                lastClientX = e.clientX;
                if (bikeMesh) touchTargetX = bikeMesh.position.x;

                // Double tap detection for Nitro burst
                const currentTime = new Date().getTime();
                if (currentTime - lastTapTime < 300) {
                    isNitroActive = true;
                }
                lastTapTime = currentTime;

                // Hide touch hint on interaction
                const hint = document.getElementById('touch-hint');
                if (hint) hint.style.opacity = '0';
            });

            container.addEventListener('pointermove', e => {
                if (!isTouching) return;
                const deltaX = e.clientX - lastClientX;
                lastClientX = e.clientX;

                // ড্রাগ ডিরেকশন অনুযায়ী পজিশন আপডেট (ডানে টানলে ডানে, বামে টানলে বামে)
                touchTargetX += deltaX * 0.03;
                touchTargetX = Math.max(-6.5, Math.min(6.5, touchTargetX));
            });

            const endTouch = () => {
                isTouching = false;
                isNitroActive = false;
            };

            container.addEventListener('pointerup', endTouch);
            container.addEventListener('pointercancel', endTouch);
            container.addEventListener('pointerleave', endTouch);
        }

        function startGame() {
            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('gameover-overlay').style.display = 'none';
            gameRunning = true;
            distance = 0;
            coinsCollected = 0;
            nitroVal = 100;
            fuelVal = 100;
            speedKMH = 80;
            touchTargetX = 0;
            if (bikeMesh) bikeMesh.position.set(0, 1, 0);

            // Clear old traffic & coins
            trafficCars.forEach(c => scene.remove(c));
            trafficCars = [];
            coinObjects.forEach(c => scene.remove(c));
            coinObjects = [];
        }

        function spawnTraffic() {
            if (Math.random() < 0.03 && trafficCars.length < 6 && bikeMesh) {
                const carGeo = new THREE.BoxGeometry(1.8, 1.2, 3.5);
                const carMat = new THREE.MeshStandardMaterial({ color: 0xff3366 });
                const car = new THREE.Mesh(carGeo, carMat);
                const laneX = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 5);
                car.position.set(laneX, 0.6, bikeMesh.position.z + 120);
                scene.add(car);
                trafficCars.push(car);
            }

            if (Math.random() < 0.04 && bikeMesh) {
                const coinGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.1, 16);
                const coinMat = new THREE.MeshBasicMaterial({ color: 0xC5FF3D });
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.rotation.x = Math.PI / 2;
                const laneX = (Math.random() - 0.5) * 10;
                coin.position.set(laneX, 0.8, bikeMesh.position.z + 120);
                scene.add(coin);
                coinObjects.push(coin);
            }
        }

        function updateGame() {
            if (!gameRunning || !bikeMesh) return;

            let targetSpeed = 120;
            if (isNitroActive && nitroVal > 0) {
                targetSpeed = 220;
                nitroVal -= 0.5;
            }

            speedKMH += (targetSpeed - speedKMH) * 0.05;
            const forwardSpeed = (speedKMH / 3.6) * 0.03;

            bikeMesh.position.z += forwardSpeed;
            distance += Math.floor(forwardSpeed * 10);
            fuelVal -= 0.005;

            // Direct touch positioning interpolation or keyboard override
            if (isTouching) {
                bikeMesh.position.x += (touchTargetX - bikeMesh.position.x) * 0.2;
            } else if (input.left && bikeMesh.position.x > -6.5) {
                bikeMesh.position.x -= 0.15;
            } else if (input.right && bikeMesh.position.x < 6.5) {
                bikeMesh.position.x += 0.15;
            }

            // Keep bike within bounds
            bikeMesh.position.x = Math.max(-6.5, Math.min(6.5, bikeMesh.position.x));

            // Camera follow
            camera.position.x = bikeMesh.position.x * 0.5;
            camera.position.z = bikeMesh.position.z - 6;
            camera.lookAt(bikeMesh.position.x, bikeMesh.position.y + 1, bikeMesh.position.z + 4);

            spawnTraffic();

            // Collision check with traffic
            for (let i = trafficCars.length - 1; i >= 0; i--) {
                const car = trafficCars[i];
                if (car && car.position.z < bikeMesh.position.z - 20) {
                    scene.remove(car);
                    trafficCars.splice(i, 1);
                    continue;
                }
                if (car && bikeMesh.position.distanceTo(car.position) < 2.0) {
                    gameOver();
                }
            }

            // Coin collection
            for (let i = coinObjects.length - 1; i >= 0; i--) {
                const coin = coinObjects[i];
                if (coin && coin.position.z < bikeMesh.position.z - 10) {
                    scene.remove(coin);
                    coinObjects.splice(i, 1);
                    continue;
                }
                if (coin && bikeMesh.position.distanceTo(coin.position) < 1.8) {
                    coinsCollected += 1;
                    scene.remove(coin);
                    coinObjects.splice(i, 1);
                }
            }

            // Update HUD UI
            document.getElementById('hud-speed').innerText = Math.floor(speedKMH) + ' KM/H';
            document.getElementById('hud-distance').innerText = distance + 'm';
            document.getElementById('hud-coins').innerText = '🪙 ' + coinsCollected;
            document.getElementById('nitro-bar').style.width = nitroVal + '%';
            document.getElementById('fuel-bar').style.width = Math.max(0, fuelVal) + '%';

            if (fuelVal <= 0) gameOver();
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('go-distance').innerText = distance + 'm';
            document.getElementById('go-coins').innerText = coinsCollected;
            document.getElementById('gameover-overlay').style.display = 'flex';
        }

        function animate() {
            requestAnimationFrame(animate);
            updateGame();
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        window.onload = () => {
            init3D();
            animate();
        };
    </script>
</body>
</html>
